[project]
name = "trustcheck"
version = "1.0.0"
description = "India-focused deterministic + LLM scam and phishing detection engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.1",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.7.0"
httpx = "^0.27.0"
uvicorn = { extras = ["standard"], version = ">=0.30" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
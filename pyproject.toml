[tool.poetry]
name = "trustcheck"
version = "1.0.0"
description = "India-focused deterministic + LLM scam and phishing detection engine"
authors = ["TrustCheck Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "trustcheck" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
pydantic = "^2.9.0"
httpx = "^0.27.0"
google-genai = "^1.0.0"
python-dotenv = "^1.0.1"
uvicorn = {extras = ["standard"], version = "^0.54.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.7.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
